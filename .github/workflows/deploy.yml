# 部署 VitePress 静态站到 GitHub Pages
#
# ⏸ 当前状态：**已暂停发布**（2026-09-15）—— 站点尚未写完，暂不对外访问。
#    配套动作：仓库已转为 private。GitHub Free 账号下私有仓库不支持 Pages，
#    线上站点 lzygjq.github.io/L-blog/ 在转 private 时被自动下线。
#    同时把下面的 push 触发器注释掉：防止日后改回 public 时，
#    一次普通 push 就把没写完的站点又发出去。
#
# ▶ 站点写完、要恢复发布时，三件事一起做（缺一不可）：
#    ① 取消下面 `push:` 两行的注释，恢复「push 到 main 自动部署」；
#    ② Settings → Pages → Build and deployment → Source 选 GitHub Actions；
#    ③ Settings → General → Danger Zone → 可见性改回 Public。
#       注：Free 账号下私有仓库用不了 Pages；Pro 虽允许从私有仓库发布，
#       但它只保证「仓库私有」，站点本身仍是公开的 —— 别指望它藏住页面。
#
# ⚠ 在 Pages 关闭的状态下手动触发本工作流会失败（deploy-pages 找不到发布目标），
#    这是预期行为，不是配置坏了。
name: Deploy VitePress site to Pages

on:
  # ↓↓ 暂停发布中：取消下面两行注释即可恢复「push 到 main 自动部署」 ↓↓
  # push:
  #   branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 权限：允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑；进行中的生产部署不被取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # frontmatter date 取自 git 提交历史，需要完整历史

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build # base 由 config.mts 按 GITHUB_ACTIONS 环境变量自动切为 /L-blog/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
