# 部署 VitePress 静态站到 GitHub Pages
#
# ▶ 当前状态：**已恢复发布**（2026-09-19）。
#    「写完要恢复发布」三件事的落地情况：
#      ① 取消 `push:` 注释、恢复自动部署 —— 2026-09-19 完成（AI 侧，本次提交）
#      ② Settings → Pages → Source 选 GitHub Actions —— 用户侧网页操作
#      ③ 可见性改回 Public —— 2026-09-19 完成（实测 API 返回 "private": false）
#    （历史：2026-09-15 曾暂停发布，仓库转 private，站点被自动下线。）
#
#    ⚠ 两个概念不要混：仓库私有 ≠ 站点私有。Pages 站点可见性跟仓库可见性无关，
#      个人账号只有 Enterprise Cloud 才有「真·私有 Pages」；Pro 只保证仓库私有，
#      站点本身依然公开 —— 想藏住页面只能「先别发布」。
#
# ⚠ 若 ② 未配置，触发本工作流会在 deploy-pages 步骤失败（找不到发布目标），
#    属预期行为，不是配置坏了。
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 权限：允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑；进行中的生产部署不被取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # frontmatter date 取自 git 提交历史，需要完整历史

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # 仓库尚未开启 Pages 时由 action 自动启用（需 pages: write 权限，本 workflow 已声明）。
          # 2026-09-19：首次触发因 Pages 未配置而失败（Setup Pages 步骤报
          # HttpError: Not Found / "Get Pages site failed"），加此参数后无需再去
          # 网页点 Settings → Pages → Source —— 部署链路自闭环。
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build # base 由 config.mts 按 GITHUB_ACTIONS 环境变量自动切为 /L-blog/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
